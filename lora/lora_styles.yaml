# ==========================================
# MD_DynamicLoRAStacker - Style Presets
# ==========================================
# Format:
#   StyleName:
#     loras:
#       - name: "filename.safetensors"
#         strength_model: 0.0-2.0
#         strength_clip: 0.0-2.0
#     prompt_prefix: "text to add before prompt"
#     prompt_suffix: "text to add after prompt"
#     description: "What this style does"
# ==========================================

# --- PHOTOGRAPHY STYLES ---

Cinematic_Film:
  description: "Hollywood cinema aesthetic with dramatic lighting and film grain"
  loras:
    - name: "add-detail-xl.safetensors"
      strength_model: 0.8
      strength_clip: 0.6
    - name: "cinematic_lighting_v2.safetensors"
      strength_model: 0.9
      strength_clip: 0.7
    - name: "film_grain.safetensors"
      strength_model: 0.5
      strength_clip: 0.3
  prompt_prefix: "cinematic, dramatic lighting, film photography, "
  prompt_suffix: ", 35mm film, film grain, depth of field, professional color grading"

Portrait_Studio:
  description: "Professional studio portrait with soft lighting"
  loras:
    - name: "perfect_eyes.safetensors"
      strength_model: 0.7
      strength_clip: 0.5
    - name: "skin_detail.safetensors"
      strength_model: 0.6
      strength_clip: 0.4
    - name: "studio_lighting.safetensors"
      strength_model: 0.8
      strength_clip: 0.6
  prompt_prefix: "professional portrait, studio lighting, "
  prompt_suffix: ", shallow depth of field, 85mm lens, soft focus background"

Street_Photography:
  description: "Candid street photography style with natural lighting"
  loras:
