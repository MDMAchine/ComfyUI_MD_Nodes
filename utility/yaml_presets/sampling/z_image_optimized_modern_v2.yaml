# ░▒▓ DESCRIPTION:
#   The Modern v2 Engine adaptation for Z-Image (4-9 Steps).
#   It uses high-precision math (1e-8) and the Split Scheduler (SST)
#   to maximize quality in very few steps.
#
#   • Engine: v2 Native (legacy_v1_5_mode: false).
#   • SST: Active. adaptive splitting improves transient handling.
#   • Noise: Brownian (Best for v2 texture generation).
#
# ░▒▓ COMPATIBILITY:
#   • Model: Z-Image / Turbo / Lightning.
#   • Scheduler: 'sgm_uniform' (Recommended for v2) or 'simple'.
# ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄

# ───────────────────────────────────────────────────────────────
# ENGINE MODE: MODERN v2
# ───────────────────────────────────────────────────────────────
legacy_v1_5_mode: false          # ✅ FALSE = Modern v2 Engine (1e-8 precision)

# SST (Split Scheduler) - v2 Exclusive Feature
# Auto-detects the best point to switch strategies.
sst_mode: "auto"
auto_cv_threshold: 2.0
auto_ratio_threshold: 0.2
fallback_percentile: 90
min_temp: 0.1
max_temp: 10.0
debug_sst: true

# ───────────────────────────────────────────────────────────────
# CORE SETTINGS (Deterministic)
# ───────────────────────────────────────────────────────────────
step_random_mode: "off"          # Z-Image requires stability
step_size: 1
seed: 0

# Ancestral Noise (Modern v2 prefers Brownian)
first_ancestral_step: 0
last_ancestral_step: -1
ancestral_noise_type: "brownian" # ✅ Smoother texture fill than Gaussian

# ───────────────────────────────────────────────────────────────
# BLENDING (Image Optimized)
# ───────────────────────────────────────────────────────────────
blend_mode: "lerp"               # ✅ LERP is cleaner for image edges
step_blend_mode: "lerp"

conditional_blend_mode: false
conditional_blend_sigma_threshold: 0.3
conditional_blend_function_name: "cubic"
conditional_blend_on_change: false
progressive_blend_mode: false

# ───────────────────────────────────────────────────────────────
# NOISE CONTROL
# ───────────────────────────────────────────────────────────────
clamp_noise_norm: false
max_noise_norm: 1.5
adaptive_noise_scaling: false    # Off for pure turbo behavior
noise_scale_factor: 1.0

# ───────────────────────────────────────────────────────────────
# FBG TUNING (Gentle Guidance)
# ───────────────────────────────────────────────────────────────
sigma_range_preset: "Custom"
fbg_sampler_mode: "PINGPONG"     # Active mode to enable Restarts

# Guidance Settings (CFG 1.0 Target)
cfg_scale: 1.0
cfg_start_sigma: 1.0
cfg_end_sigma: 0.004

# FBG Range
fbg_start_sigma: 1.0
fbg_end_sigma: 0.004

# Power Settings (Scaled down for CFG 1.0)
max_guidance_scale: 1000.0
initial_guidance_scale: 1.0
fbg_guidance_multiplier: 1.0
guidance_max_change: 0.5

# FBG Math (Image Tuning)
pi: 0.65
t_0: 0.3
t_1: 0.8
fbg_temp: 0.0
fbg_offset: 0.0

# ───────────────────────────────────────────────────────────────
# POSTERIOR (State Management)
# ───────────────────────────────────────────────────────────────
max_posterior_scale: 3.0
log_posterior_initial_value: 0.0
log_posterior_ema_factor: 0.6    # Lower smoothing for short steps

# ───────────────────────────────────────────────────────────────
# RESTARTS (Res 2 - Detail Focus)
# ───────────────────────────────────────────────────────────────
enable_restarts: true
restart_mode: "detail_focus"     # Optimized for sharpening edges
restart_noise_scale: 0.7         # 30% jump back (high for short steps)
restart_s_noise: 1.0
restart_steps: "1,2"             # Explicit steps for 4-step workflow

# ───────────────────────────────────────────────────────────────
# SYSTEM
# ───────────────────────────────────────────────────────────────
debug_mode: 2
enable_profiling: true
tensor_memory_optimization: false
gradient_norm_tracking: false
early_exit_threshold: 0.000001