# ▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀
# ████ ACE-STEP PRESET: LEGACY CRYSTAL (Hybrid) ████████████▓▒░
# © 2025 MDMAchine
# ▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀
# ░▒▓ DESCRIPTION:
#   The "Gold Standard" configuration.
#   It combines the Warmth/Punch of the Legacy Engine (1e-6 math) with the
#   Precision Tuning of v2 (Brownian Noise, Slerp Blending, Low Noise Factor).
#
#   RESULT: Deep analog bass, zero static, clear highs.
#
# ░▒▓ RECOMMENDED USAGE:
#   • Steps: 60 - 2000 (Best at high steps)
#   • Scheduler: 'sgm_uniform' (Linear) - Essential for phase timing.
#   • Genres: All (Universal high-fidelity preset).
# ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄

# ──────────────────────────────────────────────────────────────────────────────
# ENGINE MODE
# ──────────────────────────────────────────────────────────────────────────────
legacy_v1_5_mode: true           # ✅ TRUE = Reverts to v1.5.1 math (1e-6 precision)

# SST (Split Scheduler) - Ignored in Legacy Mode, but kept for compatibility
sst_mode: "auto"
auto_cv_threshold: 2.0
auto_ratio_threshold: 0.2
fallback_percentile: 90
min_temp: 0.1
max_temp: 10.0
debug_sst: true

# ──────────────────────────────────────────────────────────────────────────────
# CORE SETTINGS
# ──────────────────────────────────────────────────────────────────────────────
step_random_mode: "block"
step_size: 25
seed: 0

first_ancestral_step: 0
last_ancestral_step: -1
ancestral_noise_type: "brownian" # ✅ Brownian: Smoother than standard Gaussian

start_sigma_index: 0
end_sigma_index: -1
enable_clamp_output: false

# ──────────────────────────────────────────────────────────────────────────────
# BLENDING (INTERPOLATION)
# ──────────────────────────────────────────────────────────────────────────────
blend_mode: "slerp"              # ✅ Slerp: Preserves volume/energy better
step_blend_mode: "cosine"        # ✅ Cosine: Smooths noise injection curve

progressive_blend_mode: false
conditional_blend_mode: true     # ✅ ON: Smart switching
conditional_blend_sigma_threshold: 0.15
conditional_blend_function_name: "cubic"
conditional_blend_on_change: true
conditional_blend_change_threshold: 0.1

# ──────────────────────────────────────────────────────────────────────────────
# RESTARTS
# ──────────────────────────────────────────────────────────────────────────────
enable_restarts: true
restart_mode: "conservative"
restart_noise_scale: 0.10
restart_s_noise: 0.10            # Keep low to prevent grain buildup

# ──────────────────────────────────────────────────────────────────────────────
# FBG TUNING (DUAL PHASE CLEANUP)
# ──────────────────────────────────────────────────────────────────────────────
fbg_sampler_mode: "PINGPONG"
sigma_range_preset: "All"        # Full range active

# Phase 2: Gentle Polish (Low Sigma)
cfg_scale: 12.0                  # Standard CFG works fine in Legacy Mode
cfg_start_sigma: 1.0
cfg_end_sigma: 0.004

# Phase 1: Heavy Construction (High Sigma)
fbg_start_sigma: 1.0
fbg_end_sigma: 0.04              # Handoff point

# High Power Values (Phase 1 Only)
max_guidance_scale: 5000.0       # Massive ceiling
initial_guidance_scale: 250.0    # Kickstart
fbg_guidance_multiplier: 550.0   # Reactivity
guidance_max_change: 1000.0

# ──────────────────────────────────────────────────────────────────────────────
# FBG MATH
# ──────────────────────────────────────────────────────────────────────────────
pi: 0.40                         # Higher pi = smoother feedback loop
t_0: 0.7
t_1: 0.4
fbg_temp: 0.0
fbg_offset: 0.0

# ──────────────────────────────────────────────────────────────────────────────
# POSTERIOR (SMOOTHING)
# ──────────────────────────────────────────────────────────────────────────────
max_posterior_scale: 3.0
log_posterior_initial_value: 0.0
log_posterior_ema_factor: 0.8    # Standard Legacy smoothing

# ──────────────────────────────────────────────────────────────────────────────
# NOISE SCALING
# ──────────────────────────────────────────────────────────────────────────────
clamp_noise_norm: false
max_noise_norm: 1.5
adaptive_noise_scaling: true     # ✅ ON: Dynamic scaling
noise_scale_factor: 0.15         # ✅ 0.15: The secret to "Crystal Clean" output

# ──────────────────────────────────────────────────────────────────────────────
# SYSTEM
# ──────────────────────────────────────────────────────────────────────────────
debug_mode: 2
enable_profiling: true
tensor_memory_optimization: false
gradient_norm_tracking: false
early_exit_threshold: 0.000001
checkpoint_steps_str: ""