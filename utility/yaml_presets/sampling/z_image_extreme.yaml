# ░▒▓ DESCRIPTION:
#   Maximum speed configuration for Z-Image.
#   Designed for 4-step generation cycles.
#
#   • Optimization: Disables all overhead (Restarts, Smoothing).
#   • Randomness: 'step' mode ensures consistent noise patterns across batches.
# ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄

# ───────────────────────────────────────────────────────────────
# CORE SETTINGS
# ───────────────────────────────────────────────────────────────
step_random_mode: "step"         # Consistent noise pattern
step_size: 4                     # Matches total steps
seed: 0

first_ancestral_step: 0
last_ancestral_step: -1
ancestral_noise_type: "gaussian" # Simple gaussian is faster

# ───────────────────────────────────────────────────────────────
# BLENDING
# ───────────────────────────────────────────────────────────────
blend_mode: "lerp"               # Pure linear interpolation
step_blend_mode: "lerp"

conditional_blend_mode: false    # Disabled for speed
progressive_blend_mode: false

# ───────────────────────────────────────────────────────────────
# FBG TUNING
# ───────────────────────────────────────────────────────────────
fbg_sampler_mode: "PINGPONG"
sigma_range_preset: "Custom"

cfg_scale: 1.0                   # Native CFG
cfg_start_sigma: 1.0
cfg_end_sigma: 0.004

fbg_start_sigma: 1.0
fbg_end_sigma: 0.004

# Minimal Guidance Power
max_guidance_scale: 1.0
initial_guidance_scale: 1.0
fbg_guidance_multiplier: 0.0
guidance_max_change: 0.0

pi: 0.65
t_0: 0.3
t_1: 0.8
fbg_temp: 0.0
fbg_offset: 0.0

# ───────────────────────────────────────────────────────────────
# RESTARTS (Disabled)
# ───────────────────────────────────────────────────────────────
enable_restarts: false           # Too slow for 4-step workflow

# ───────────────────────────────────────────────────────────────
# SYSTEM
# ───────────────────────────────────────────────────────────────
debug_mode: 1
enable_profiling: false
tensor_memory_optimization: true