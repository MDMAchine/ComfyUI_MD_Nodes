# ══════════════════════════════════════════════════════════════════════════════
#
# If you change step count, adjust ADG angle proportionally:
#
# Formula: ADG_angle = 0.39 * (60 / your_steps)
#
# Step Count | Recommended ADG Angle | Notes
# -----------|----------------------|------------------
# 60         | 0.39                 | Reference config
# 120        | 0.20                 | Good balance
# 150        | 0.16                 | Fast production
# 180        | 0.15                 | ✅ PRODUCTION (this config)
# 200        | 0.12                 | Very safe
# 220        | 0.11                 | Conservative
