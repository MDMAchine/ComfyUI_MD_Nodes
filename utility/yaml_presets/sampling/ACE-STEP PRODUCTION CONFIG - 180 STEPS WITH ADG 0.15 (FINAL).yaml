# • max_angle: 0.15  ← CRITICAL! This is the magic number for 180 steps
#
# Scheduler (Casual Scheduler recommended):
# • mode: "linear_quadratic"
# • shift: 1.05
# • steps: 180  ← Match your step count
# • rho: 7.0
