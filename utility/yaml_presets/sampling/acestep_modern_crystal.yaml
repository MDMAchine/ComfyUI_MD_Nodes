# ▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀
# ████ ACE-STEP PRESET: MODERN CRYSTAL (v2 Native) ██████████▓▒░
# © 2025 MDMAchine
# ▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀
# ░▒▓ DESCRIPTION:
#   The ultimate "Clean Digital" preset. It uses the high-precision v2 engine
#   (1e-8 math) but solves the "static/hiss" problem by using a Dual-Phase
#   strategy:
#     1. Heavy Phase (High Sigma): Massive guidance builds structure.
#     2. Polish Phase (Low Sigma): Guidance drops to 4.0 to scrub static.
#
# ░▒▓ RECOMMENDED USAGE:
#   • Steps: 40 - 80 (Sweet spot for clean, detailed audio)
#   • Scheduler: 'sgm_uniform' (Linear) - Required for proper cleanup timing.
#   • Genres: IDM, Glitch, Future Bass, Hyperpop.
# ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄

# ──────────────────────────────────────────────────────────────────────────────
# ENGINE MODE
# ──────────────────────────────────────────────────────────────────────────────
legacy_v1_5_mode: false          # ✅ FALSE = Modern v2 Engine (1e-8 precision)

# SST (Split Scheduler) Tuning
sst_mode: "auto"
auto_cv_threshold: 2.0
auto_ratio_threshold: 0.2
fallback_percentile: 90
min_temp: 0.1
max_temp: 10.0
debug_sst: true                  # Keep enabled to monitor phase transitions

# ──────────────────────────────────────────────────────────────────────────────
# CORE SETTINGS
# ──────────────────────────────────────────────────────────────────────────────
step_random_mode: "block"
step_size: 25
seed: 0

first_ancestral_step: 0
last_ancestral_step: -1
ancestral_noise_type: "brownian" # Smoother noise for digital engine

start_sigma_index: 0
end_sigma_index: -1
enable_clamp_output: false

# ──────────────────────────────────────────────────────────────────────────────
# BLENDING (INTERPOLATION)
# ──────────────────────────────────────────────────────────────────────────────
# Using 'slerp' -> 'cubic' ensures we keep energy but smooth the digital edges.
blend_mode: "slerp"
step_blend_mode: "cosine"

progressive_blend_mode: false
conditional_blend_mode: true     # ✅ ON: Switch blend mode at low sigma
conditional_blend_sigma_threshold: 0.15
conditional_blend_function_name: "cubic" # Use cubic for final polish steps
conditional_blend_on_change: true
conditional_blend_change_threshold: 0.1

# ──────────────────────────────────────────────────────────────────────────────
# RESTARTS
# ──────────────────────────────────────────────────────────────────────────────
enable_restarts: true
restart_mode: "conservative"
restart_noise_scale: 0.10
restart_s_noise: 0.10            # Low noise injection

# ──────────────────────────────────────────────────────────────────────────────
# FBG TUNING (THE "STATIC KILLER" SETUP)
# ──────────────────────────────────────────────────────────────────────────────
fbg_sampler_mode: "PINGPONG"
sigma_range_preset: "Custom"     # Must be Custom for Dual-Phase logic

# ✅ PHASE 2: GENTLE POLISH (Low Sigma)
# Active when sigma < 0.04. Low CFG scrubs static.
cfg_scale: 12.0                  # Standard CFG for cleanup
cfg_start_sigma: 1.0
cfg_end_sigma: 0.004

# ✅ PHASE 1: HEAVY CONSTRUCTION (High Sigma)
# Active when sigma > 0.04. Builds the heavy Ace-Step sound.
fbg_start_sigma: 1.0
fbg_end_sigma: 0.04              # Handoff point (very late in generation)

# High Power Values (Phase 1 Only)
max_guidance_scale: 5000.0       # Massive ceiling for dynamics
initial_guidance_scale: 250.0    # Kickstart
fbg_guidance_multiplier: 550.0   # Reactivity
guidance_max_change: 1000.0

# ──────────────────────────────────────────────────────────────────────────────
# FBG MATH (AUTO-CALCULATION)
# ──────────────────────────────────────────────────────────────────────────────
pi: 0.40                         # Higher pi (0.40) = slightly smoother feedback
t_0: 0.7
t_1: 0.4
fbg_temp: 0.0
fbg_offset: 0.0

# ──────────────────────────────────────────────────────────────────────────────
# POSTERIOR (SMOOTHING)
# ──────────────────────────────────────────────────────────────────────────────
max_posterior_scale: 3.0
log_posterior_initial_value: 0.0
log_posterior_ema_factor: 0.8    # High smoothing (0.8) prevents jitter/static

# ──────────────────────────────────────────────────────────────────────────────
# NOISE SCALING
# ──────────────────────────────────────────────────────────────────────────────
clamp_noise_norm: false
max_noise_norm: 1.5
adaptive_noise_scaling: true     # ✅ ON: Dynamically scales noise
noise_scale_factor: 0.15         # ✅ 0.15: Greatly reduced noise for clean output

# ──────────────────────────────────────────────────────────────────────────────
# SYSTEM
# ──────────────────────────────────────────────────────────────────────────────
debug_mode: 1
enable_profiling: true
tensor_memory_optimization: false
gradient_norm_tracking: false
early_exit_threshold: 0.000001
checkpoint_steps_str: ""