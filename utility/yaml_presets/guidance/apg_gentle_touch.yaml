# ▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀
# ████ APG GUIDANCE: GENTLE TOUCH (Natural Dynamics) █████████▓▒░
# © 2025 MDMAchine
# ▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀
# ░▒▓ DESCRIPTION:
#   A conservative configuration that prioritizes audio fidelity over
#   strict prompt adherence. It uses low CFG values to allow natural
#   reverb tails and dynamics to survive.
#
# ░▒▓ USE CASE:
#   • Acoustic instruments, Orchestral, Ambient.
#   • When "Granular Glide" sounds too harsh/compressed.
# ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄

verbose: true

rules:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 0: SETUP - Moderate Start (σ > 0.8)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - start_sigma: -1
    apg_scale: 0.0
    cfg: 6.0             # Much lower starting CFG
    predict_image: true

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 1: ENHANCE - Subtle Contrast (σ ≤ 0.8)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - start_sigma: 0.8
    apg_scale: 2.5       # Very mild APG
    cfg: 5.5
    predict_image: true
    pre_cfg_mode: false
    update_mode: "DEFAULT"
    update_blend_mode: "slerp"   # Slerp is smoother/gentler
    dims: [-1]
    momentum: 0.5        # Low momentum = flexible generation
    norm_threshold: 1.5  # Strict limit on corrections

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 2: REFINE - Low Pressure (σ ≤ 0.4)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - start_sigma: 0.4
    apg_scale: 1.5
    cfg: 4.5
    predict_image: true
    pre_cfg_mode: false
    update_mode: "DEFAULT"
    update_blend_mode: "slerp"
    dims: [-1]
    momentum: 0.4
    norm_threshold: 1.5

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 3: FADE OUT - Almost Zero (σ ≤ 0.1)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - start_sigma: 0.1
    apg_scale: 0.0       # Turn off APG early
    cfg: 2.5             # Bare minimum guidance
    predict_image: true