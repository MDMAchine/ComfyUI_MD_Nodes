# ═══════════════════════════════════════════════════════════════
# APG PRODUCTION CONFIG - 180 STEPS WITH ADG 0.15 (FINAL)
# ═══════════════════════════════════════════════════════════════
# Status: PRODUCTION READY ✅
# Tested: 2025-12-21 | Result: Clean vocals, no harshness
# Optimized For: ACE-Step audio with PingPong FBG + ADG 0.15
# ═══════════════════════════════════════════════════════════════

verbose: true         # Show detailed rule matching in console

# ───────────────────────────────────────────────────────────────
# 📋 PHASE BREAKDOWN (Chronological Order)
# ───────────────────────────────────────────────────────────────
# Phase 0 (Bootstrap):    Steps 0-52   | σ > 0.90  | CFG=25  | APG OFF
# Phase 1 (Heavy Build):  Steps 53-70  | σ > 0.60  | CFG=22  | APG=4.8
# Phase 2 (Mid Guidance): Steps 71-86  | σ > 0.40  | CFG=20  | APG=3.2
# Phase 3 (Refinement):   Steps 87-102 | σ > 0.25  | CFG=18  | APG=2.8
# Phase 4 (Detail):       Steps 103-128| σ > 0.10  | CFG=16  | APG=2.5
# Phase 5 (Polish):       Steps 129-173| σ > 0.01  | CFG=14  | APG=1.75
# Phase 6 (Final):        Steps 174-179| σ ≤ 0.01  | CFG=13  | APG OFF
# ───────────────────────────────────────────────────────────────

rules:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 0: BOOTSTRAP - Maximum Noise (σ > 0.90)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Establishes initial structure with strong CFG, no APG interference.
  # Using start_sigma: -1 makes this the fallback for all high sigmas.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - start_sigma: -1
    apg_scale: 0.0       # APG OFF during bootstrap
    cfg: 25.0            # Strong directional guidance
    predict_image: true

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 1: HEAVY STRUCTURE BUILD - Very High Noise (σ ≤ 0.90)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # APG activates here. Reduced from 6.0 to 4.8 (20% reduction)
  # to prevent over-correction and vocal harshness.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - start_sigma: 0.9
    apg_scale: 4.8         # ✅ REDUCED: Was 6.0 (prevents over-correction)
    cfg: 22.0              # Strong but descending from bootstrap
    predict_image: true
    pre_cfg_mode: false
    update_mode: "DEFAULT"
    update_blend_mode: lerp
    dims: [-1]             # Normalize over frequency dimension
    momentum: 0.8          # High momentum for structural stability
    norm_threshold: 2.5

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 2: MAIN GUIDANCE - High Noise (σ ≤ 0.60)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Reduced APG from 4.0 to 3.2 (20% reduction).
  # This phase handles most of the musical structure.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - start_sigma: 0.6
    apg_scale: 3.2        # ✅ REDUCED: Was 4.0
    cfg: 20.0
    predict_image: true
    pre_cfg_mode: false
    update_mode: "DEFAULT"
    update_blend_mode: lerp
    dims: [-1]
    momentum: 0.8
    norm_threshold: 2.5

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 3: MID-RANGE REFINEMENT - Medium Noise (σ ≤ 0.40)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Reduced APG from 3.5 to 2.8 (20% reduction).
  # Transitioning from structure to detail.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - start_sigma: 0.4
    apg_scale: 2.8        # ✅ REDUCED: Was 3.5
    cfg: 18.0
    predict_image: true
    pre_cfg_mode: false
    update_mode: "DEFAULT"
    update_blend_mode: lerp
    dims: [-1]
    momentum: 0.7         # ✅ REDUCED: Lower momentum for more flexibility
    norm_threshold: 2.5

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 4: LATE DETAIL - Low-Medium Noise (σ ≤ 0.25)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Gentle APG for detail enhancement. Using slerp for energy preservation.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - start_sigma: 0.25
    apg_scale: 2.5
    cfg: 16.0
    predict_image: true
    pre_cfg_mode: false
    update_mode: "DEFAULT"
    update_blend_mode: slerp  # Preserve magnitude in detail phase
    dims: [-1]
    momentum: 0.6         # ✅ REDUCED: Even lower for vocal clarity
    norm_threshold: 2.5

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 5: FINE-TUNING - Low Noise (σ ≤ 0.10)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Very gentle APG for final polish. This is where vocals get refined.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - start_sigma: 0.1
    apg_scale: 1.75       # Minimal APG interference
    cfg: 14.0
    predict_image: true
    pre_cfg_mode: false
    update_mode: "DEFAULT"
    update_blend_mode: slerp
    dims: [-1]
    momentum: 0.6         # Keep low momentum for clarity
    norm_threshold: 2.5

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PHASE 6: FINAL POLISH - Very Low Noise (σ ≤ 0.01)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # APG completely off. Let FBG and base CFG finish naturally.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - start_sigma: 0.01
    apg_scale: 0.0        # APG OFF for clean finish
    cfg: 13.0             # Gentle final CFG
    predict_image: true

# ═══════════════════════════════════════════════════════════════
# 📊 PRODUCTION VALIDATION
# ═══════════════════════════════════════════════════════════════
#
# This configuration was tested on 2025-12-21 with:
# • PingPong FBG sampler (legacy mode)
# • 180 steps
# • ADG 0.15
# • Casual scheduler (linear_quadratic, shift 1.05, rho 7.0)
#
# Results:
# ✅ Clean vocals without harshness
# ✅ Strong structure and coherence
# ✅ Good frequency response across spectrum
# ✅ No distortion or grain artifacts
#
# ═══════════════════════════════════════════════════════════════
# 🔧 CHANGES FROM ORIGINAL CONFIG
# ═══════════════════════════════════════════════════════════════
#
# ALL APG scales reduced by 20%:
# • Phase 1: 6.0 → 4.8
# • Phase 2: 4.0 → 3.2
# • Phase 3: 3.5 → 2.8
#
# Momentum reduced in vocal-critical phases:
# • Phase 3: 0.8 → 0.7
# • Phase 4: 0.8 → 0.6
# • Phase 5: 0.8 → 0.6
#
# Reason: Prevents APG over-correction that causes "taxing" vocals.
# Lower momentum allows more natural vocal expression.
#
# ═══════════════════════════════════════════════════════════════
# 💡 OPTIONAL TWEAKS
# ═══════════════════════════════════════════════════════════════
#
# If vocals are STILL slightly harsh:
# • Reduce Phase 2-4 apg_scale by another 10%
#   Phase 2: 3.2 → 2.9
#   Phase 3: 2.8 → 2.5
#   Phase 4: 2.5 → 2.2
#
# If you want MORE aggressive guidance:
# • Increase Phase 1-2 apg_scale by 10%
#   Phase 1: 4.8 → 5.3
#   Phase 2: 3.2 → 3.5
#
# For SMOOTHER transitions:
# • Use "cosine" update_blend_mode in Phases 1-3
#   (Currently using "lerp" for stability)
#
# ═══════════════════════════════════════════════════════════════
# ⚠️ CRITICAL NOTES
# ═══════════════════════════════════════════════════════════════
#
# 1. This APG config is TUNED FOR ADG 0.15
#    • If you change ADG angle, you may need to adjust APG scales
#    • Higher ADG angle → can reduce APG scales further
#    • Lower ADG angle → may need to increase APG scales
#
# 2. This config assumes 180 steps
#    • Different step counts may need phase boundary adjustments
#    • The sigma thresholds (0.9, 0.6, 0.4, etc.) are tuned for
#      the casual scheduler with shift 1.05 and rho 7.0
#
# 3. The 20% APG reduction is ESSENTIAL
#    • Without it, vocals sound "taxing" and harsh
#    • This is the key fix from the original config
#
# ═══════════════════════════════════════════════════════════════